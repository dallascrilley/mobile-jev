name: AgentDeviceFixture
options:
  bundleIdPrefix: com.dallascrilley.agentdeviceios
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '5.0'
    # Signing is intentionally absent. Pass DEVELOPMENT_TEAM and signing
    # settings on the xcodebuild command line (see README.md).
    CODE_SIGN_STYLE: Automatic
targets:
  AgentDeviceFixture:
    type: application
    platform: iOS
    deploymentTarget: '17.0'
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dallascrilley.agentdeviceios.fixture
        PRODUCT_NAME: AgentDeviceFixture
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        INFOPLIST_KEY_CFBundleDisplayName: Agent Device Fixture
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
schemes:
  AgentDeviceFixture:
    build:
      targets:
        AgentDeviceFixture: all
    run:
      config: Debug
